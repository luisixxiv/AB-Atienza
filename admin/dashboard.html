<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Admin | AB Atienza Construction Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <div class="app">
      <div class="sidebar">
        <div>
          <a href="../index.html"
            ><img class="sidelogo" src="../images/ab-logo.svg" alt="AB Atienza logo"
          /></a>
          <p class="sidelabel">ADMIN</p>
          <div class="navitem on" data-section="overview" onclick="showSection('overview')">
            <i class="bi bi-grid-1x2-fill"></i>Overview
          </div>
          <div class="navitem" data-section="projects" onclick="showSection('projects')">
            <i class="bi bi-buildings-fill"></i>Projects<span class="badge" id="badgeProjects"></span>
          </div>
          <div class="navitem" data-section="leads" onclick="showSection('leads')">
            <i class="bi bi-inbox-fill"></i>Leads and inbox<span class="badge" id="badgeLeads"></span>
          </div>
          <div class="navitem" data-section="payments" onclick="showSection('payments')">
            <i class="bi bi-wallet2"></i>Payments<span class="badge" id="badgePayments"></span>
          </div>
          <div class="navitem" data-section="activity" onclick="showSection('activity')">
            <i class="bi bi-clock-history"></i>Activity
          </div>
        </div>
        <div>
          <div class="usercard">
            <span class="avatar">AB</span>
            <div><b>Office account</b><br /><small>AB Atienza admin</small></div>
          </div>
          <a class="sidelink" href="../portal/dashboard.html" target="_blank"
            ><i class="bi bi-eye-fill"></i>View client dashboard</a
          >
          <a class="sidelink" href="../index.html"
            ><i class="bi bi-box-arrow-up-left"></i>Back to website</a
          >
          <div class="sidelink" onclick="logOut()">
            <i class="bi bi-box-arrow-right"></i>Log out
          </div>
        </div>
      </div>

      <div class="main">
        <div class="panelbox on" id="overview"><div id="overviewBody"></div></div>

        <div class="panelbox" id="projects">
          <div class="headrow">
            <div>
              <h1>Projects</h1>
              <p class="pagesub">Ongoing work and the history of finished projects.</p>
            </div>
            <button class="btn" onclick="toggleNewProject()">
              <i class="bi bi-plus-lg"></i> New project
            </button>
          </div>
          <div class="box" id="newProjectBox" style="display: none">
            <h3>New project</h3>
            <div class="formrow">
              <div class="field"><label>Project name</label><input type="text" id="npName" /></div>
              <div class="field"><label>Client name</label><input type="text" id="npClient" /></div>
            </div>
            <div class="formrow">
              <div class="field"><label>Client email</label><input type="text" id="npEmail" /></div>
              <div class="field"><label>Client phone</label><input type="text" id="npPhone" /></div>
            </div>
            <div class="formrow">
              <div class="field"><label>Location</label><input type="text" id="npLocation" value="Lucena City, Quezon" /></div>
              <div class="field">
                <label>Type</label>
                <select id="npType"><option>Residential</option><option>Commercial</option><option>Renovation</option><option>Resort</option></select>
              </div>
            </div>
            <div class="formrow three">
              <div class="field"><label>Contract price (PHP)</label><input type="number" id="npPrice" /></div>
              <div class="field"><label>Start date</label><input type="date" id="npStart" /></div>
              <div class="field"><label>Target turnover</label><input type="date" id="npTarget" /></div>
            </div>
            <p class="formerror" id="npError"></p>
            <button class="btn" onclick="createProject()">Create project</button>
          </div>
          <div class="toolbar">
            <div class="tabs">
              <button class="tab on" id="tabOngoing" onclick="setProjectFilter('Ongoing')">Ongoing</button>
              <button class="tab" id="tabHistory" onclick="setProjectFilter('History')">History</button>
              <button class="tab" id="tabAll" onclick="setProjectFilter('All')">All</button>
            </div>
            <input type="text" id="projectSearch" placeholder="Search projects, clients or places" onkeyup="renderProjects()" />
          </div>
          <div id="projectList"></div>
        </div>

        <div class="panelbox" id="manage"><div id="manageBody"></div></div>
        <div class="panelbox" id="leads"><div id="leadsBody"></div></div>
        <div class="panelbox" id="payments"><div id="paymentsBody"></div></div>
        <div class="panelbox" id="activity"><div id="activityBody"></div></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../js/data.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
