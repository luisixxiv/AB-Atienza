<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>My Project | AB Atienza Construction Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>
  <body>
    <!-- The content of this page comes from js/data.js. The office updates it from the admin dashboard. -->
    <div class="app">
      <div class="sidebar">
        <div>
          <a href="../index.html"
            ><img class="sidelogo" src="../images/ab-logo.svg" alt="AB Atienza logo"
          /></a>
          <p class="sidelabel">CLIENT PORTAL</p>
          <div class="navitem on" data-section="overview" onclick="showSection('overview')">
            <i class="bi bi-grid-1x2-fill"></i>Overview
          </div>
          <div class="navitem" data-section="progress" onclick="showSection('progress')">
            <i class="bi bi-bar-chart-steps"></i>Construction
          </div>
          <div class="navitem" data-section="photos" onclick="showSection('photos')">
            <i class="bi bi-images"></i>Photo log
          </div>
          <div class="navitem" data-section="documents" onclick="showSection('documents')">
            <i class="bi bi-folder2-open"></i>Documents<span class="badge" id="docBadge"></span>
          </div>
          <div class="navitem" data-section="payments" onclick="showSection('payments')">
            <i class="bi bi-wallet2"></i>Payments
          </div>
          <div class="navitem" data-section="messages" onclick="showSection('messages')">
            <i class="bi bi-chat-dots-fill"></i>Messages<span class="badge" id="msgBadge"></span>
          </div>
        </div>
        <div>
          <div class="usercard">
            <span class="avatar" id="userInitials">AB</span>
            <div><b id="userName">Client</b><br /><small id="userProject">Project</small></div>
          </div>
          <a class="sidelink" href="../index.html"
            ><i class="bi bi-box-arrow-up-left"></i>Back to website</a
          >
          <div class="sidelink" onclick="logOut()">
            <i class="bi bi-box-arrow-right"></i>Log out
          </div>
        </div>
      </div>

      <div class="main">
        <div class="panelbox on" id="overview"><div id="overviewBody"></div></div>
        <div class="panelbox" id="progress"><div id="progressBody"></div></div>
        <div class="panelbox" id="photos"><div id="photosBody"></div></div>
        <div class="panelbox" id="documents"><div id="documentsBody"></div></div>
        <div class="panelbox" id="payments"><div id="paymentsBody"></div></div>
        <div class="panelbox" id="messages"><div id="messagesBody"></div></div>
      </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closePhoto()">
      <button><i class="bi bi-x-lg"></i></button>
      <img id="bigPhoto" src="../images/after.jpg" alt="Big photo" />
    </div>
    <div class="toast" id="toast"></div>
    <script src="../js/data.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>
